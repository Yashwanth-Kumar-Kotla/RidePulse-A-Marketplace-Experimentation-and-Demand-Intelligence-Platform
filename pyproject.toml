[project]
name = "ridepulse"
version = "0.1.0"
description = "Marketplace experimentation & demand intelligence platform on NYC TLC HVFHS data"
authors = [
    { name = "Yashwanth Kumar Kotla", email = "yashwanthkumarkotla@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "requests>=2.32",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "lightgbm>=4.7.0",
    "mlflow>=3.15.1",
    "matplotlib>=3.11.1",
    "pulp>=3.3.2",
    "streamlit>=1.62.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
